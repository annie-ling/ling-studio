<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f4ee"><title>LING Studio｜創作與成長工作室</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#503f33;background:#eee8df}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #977356;outline-offset:2px}.app{max-width:1100px;min-height:100dvh;margin:auto;display:grid;grid-template-columns:224px 1fr;background:#f8f4ee}.side{background:#fffaf4;border-right:1px solid #e5d9cd;padding:28px 17px}.brand{font-weight:850;font-size:25px;color:#6b503b;letter-spacing:-.7px}.brand span{font-weight:400}.small{font-size:12px;color:#9d8978;line-height:1.6}.side nav{display:flex;flex-direction:column;gap:7px;margin-top:40px}.navbtn{border:0;border-radius:12px;background:transparent;color:#806a57;display:flex;align-items:center;text-align:left;gap:12px;padding:13px;font-size:14px}.navbtn.active{background:#ebddce;color:#644b36;font-weight:750}.area{min-width:0;padding:29px clamp(15px,4vw,43px) 50px}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.card{background:#fffdfa;border:1px solid #e8dfd5;padding:20px;border-radius:18px;margin-bottom:14px}.hero{background:#e9d8c6;border-radius:20px;padding:26px;margin-bottom:18px}.hero h1{margin:7px 0;font-size:clamp(21px,3vw,29px)}h2{margin:10px 0 5px;font-size:23px}h3{font-size:15px;margin:24px 0 12px}.sub{color:#9a8777;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.metric strong{display:block;font-size:30px;color:#755842}.btn{border:0;border-radius:12px;background:#765a46;color:#fff;font-size:13px;font-weight:700;padding:12px 15px}.btn.alt{background:#eee2d6;color:#735943}.btn.white{background:#fffdfa;color:#765a46;border:1px solid #e5d9cd}.btn:disabled{opacity:.45;cursor:default}.btn.full{width:100%}.field{display:block;width:100%;min-width:0;border:1px solid #e1d5c7;background:#fff;border-radius:11px;padding:11px;color:#513e30}.fieldlabel{font-size:13px;font-weight:720;display:block;margin:16px 0 7px}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#fff;border:1px solid #e5d9cd;color:#785e48;border-radius:99px;padding:8px 12px;font-size:12px}.pill.on{background:#765a46;color:white;border-color:#765a46}.scoregrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.score{border:1px solid #e5d9cd;border-radius:12px;background:white;color:#846750;padding:14px 0;font-size:19px;font-weight:800}.score.on{background:#765a46;color:#fff}.soft{background:#f3ebe2;padding:15px;border-radius:13px}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-height:55px;background:white;border:0;border-radius:10px;color:#775c47;font-size:12px}.day.selected{background:#765a46;color:white}.day.dim{opacity:.3}.day .dot{display:block;color:#bf8e68;font-size:16px;line-height:8px}.day.selected .dot{color:white}.item{background:white;border:1px solid #e8dfd5;border-radius:13px;padding:13px;margin:9px 0}.item-title{font-size:14px;font-weight:750;overflow-wrap:anywhere}.tag{font-size:11px;border-radius:7px;padding:5px 7px;background:#f1e8dd;color:#795c47}.mini{border:0;border-radius:8px;padding:7px 9px;background:#eee4d9;color:#755a46;font-size:11px}.mini.warn{color:#ab645b;background:#faf0ee}.progress{height:9px;background:#e5d9cb;border-radius:15px;overflow:hidden}.fill{height:100%;background:#aa8263}.empty{font-size:13px;color:#9b8877;padding:24px;text-align:center}.mobile-nav{display:none}.dialogwrap{position:fixed;inset:0;background:#332317a3;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.dialog{width:min(520px,100%);max-height:85dvh;overflow:auto;background:#fffdfa;border-radius:19px;padding:21px}.prompt{line-height:1.65;font-size:12px}.chart{width:100%;max-height:200px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#624a39;color:white;border-radius:12px;padding:12px 18px;z-index:99;font-size:13px;box-shadow:0 4px 20px #0002}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border:1px solid #e7dcd0;border-radius:16px;padding:18px;text-align:left;background:white;min-height:105px}.tile b{display:block;margin-top:12px;font-size:14px}.space{height:9px}.logo-bubble{background:#efe1d2;padding:10px;border-radius:50%}p{line-height:1.7}textarea{resize:vertical}#dialogHost:empty{display:none}@media(max-width:720px){.app{display:block}.side{display:none}.area{padding:19px 14px 105px}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fffcf8;border-top:1px solid #e6dbcf;z-index:10;padding:8px 2px max(10px,env(safe-area-inset-bottom))}.mobile-nav button{background:none;border:0;color:#9c8877;font-size:10px;padding:5px 0;display:flex;align-items:center;flex-direction:column;gap:3px}.mobile-nav button.active{color:#72553e;font-weight:800}.mobile-nav .ico{font-size:20px}.toast{bottom:80px}.card{padding:16px}.hero{padding:20px}.tile{padding:14px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">LING <span>studio.</span></div><div class="small">創作 × 復盤 × 成長</div><nav id="desktopnav"></nav><div class="small" style="margin-top:35px">V0.8 · 本機儲存版<br>無需付費 AI API</div></aside><div class="area"><div class="topline"><div><div class="brand" style="font-size:20px">LING <span>studio.</span></div><div class="small">讓想法成為作品，也讓日子留下成長</div></div><button class="btn alt" data-action="settings">⚙ 設定</button></div><main id="view"></main></div></div><nav class="mobile-nav" id="mobilenav"></nav><div id="dialogHost"></div><div id="toastHost" aria-live="polite"></div>
<script>
(()=>{'use strict';const KEY='lingstudio-standalone-v08';const $=(sel,scope=document)=>scope.querySelector(sel);const $$=(sel,scope=document)=>[...scope.querySelectorAll(sel)];const pad=n=>String(n).padStart(2,'0');const date=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const NOW=new Date(),TODAY=date(NOW);const escape=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const randomId=()=>Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);const initial={page:'home',date:TODAY,year:NOW.getFullYear(),month:NOW.getMonth(),reviews:{},items:[],goals:{publish:8,review:20},topic:'',mode:'腳本',format:'短影音',tone:'共鳴',draft:'',filter:'全部',setup:null};let state={...initial};try{const data=JSON.parse(localStorage.getItem(KEY));if(data&&typeof data==='object')state={...initial,...data,page:'home',date:TODAY}}catch{};const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('無法儲存，請檢查瀏覽器儲存空間');return false}};function toast(t){$('#toastHost').innerHTML=`<div class="toast">${escape(t)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toastHost').innerHTML='',2500)}const reviews=()=>Object.entries(state.reviews).filter(([k,v])=>v&&Number(v.score)>=1);const reviewMonth=()=>reviews().filter(([k])=>k.slice(0,7)===TODAY.slice(0,7));const scores=xs=>xs.length?(xs.reduce((a,b)=>a+Number(b),0)/xs.length).toFixed(1):'—';const statuses=['靈感','製作中','已發布'];const navs=[['home','⌂','首頁'],['create','✦','創作'],['calendar','▦','排程'],['review','♡','復盤'],['mine','◎','我的']];const title=(a,b)=>`<h2>${a}</h2><div class="sub" style="margin-bottom:19px">${b}</div>`;const tabs=(values,selected,attr)=>values.map(v=>`<button class="pill ${v===selected?'on':''}" data-${attr}="${escape(v)}">${escape(v)}</button>`).join('');function renderNav(){for(const id of ['desktopnav','mobilenav'])$('#'+id).innerHTML=navs.map(([p,i,t])=>`<button data-page="${p}" class="${p===state.page?'active':''}"><span class="${id==='mobilenav'?'ico':''}">${i}</span>${t}</button>`).join('')}
function home(){let pending=state.items.filter(x=>x.status!=='已發布'),r=state.reviews[TODAY];return `<div class="hero"><div class="small">YOUR CREATIVE SPACE ✦</div><h1>每天前進一點點，就很值得 ☁️</h1><div style="font-size:13px">靈感、腳本、發布與每日復盤，都在這裡。</div></div><div class="grid"><div class="card metric"><strong>${pending.length}</strong><span class="sub">待完成創作</span></div><div class="card metric"><strong>${reviews().length}</strong><span class="sub">累積復盤天數</span></div></div><h3>今天的復盤</h3><div class="card"><div class="row"><div><b>${r?`${r.score} / 5 分`:'今天還沒評分'}</b><div class="small">${r?'回顧自己今天的收穫':'1～5 分＋3 個簡短問題'}</div></div><span style="font-size:27px">📓</span></div><button class="btn alt" style="margin-top:13px" data-page="review">開始 / 查看復盤 →</button></div><h3>快捷工作區</h3><div class="tiles">${[['✨','靈感與腳本','create'],['📅','內容行事曆','calendar'],['📓','每日復盤','review'],['🎯','目標與內容庫','mine']].map(([i,t,p])=>`<button class="tile" data-page="${p}"><span style="font-size:23px">${i}</span><b>${t}</b></button>`).join('')}</div><div class="card" style="margin-top:16px"><div class="row"><div><b>✦ ChatGPT 協作</b><div class="small">一鍵產生指令，複製並開啟 GPT</div></div><button class="btn" data-page="create">開始使用</button></div></div>${pending.length?`<h3>還沒完成的內容</h3>${itemsHTML(pending.slice(0,3))}`:''}`}
function create(){return title('靈感製造機 ✨','從題材到腳本，再用 ChatGPT 深度優化')+`<div class="card"><label class="fieldlabel">01 · 創作模式</label><div class="pills">${tabs(['靈感','腳本','文案'],state.mode,'mode')}</div><label class="fieldlabel">02 · 發布形式</label><div class="pills">${tabs(['短影音','輪播貼文','Threads'],state.format,'format')}</div><label class="fieldlabel">03 · 內容風格</label><div class="pills">${tabs(['共鳴','實用','故事'],state.tone,'tone')}</div><label class="fieldlabel">你的創作主題</label><input class="field" id="topic" placeholder="例：在感情裡如何建立安全感？" value="${escape(state.topic)}"><button class="btn full" data-action="generate" style="margin-top:14px">✦ 產生創作框架</button></div>${state.draft?`<div class="card"><div class="row"><b>可編輯草稿</b><span class="sub">可直接修改</span></div><textarea id="draft" rows="11" class="field" style="margin:12px 0;line-height:1.7">${escape(state.draft)}</textarea><div class="grid"><button class="btn alt" data-action="copydraft">複製草稿</button><button class="btn alt" data-action="savedraft">存入內容庫</button></div><button class="btn full" data-gpt="create" style="margin-top:10px">✦ 用 ChatGPT 優化內容 ↗</button></div>`:`<div class="card"><b>✦ ChatGPT 創作助手</b><p class="small">不產生 API 費用。可直接組合指令，讓 ChatGPT 協助發想或寫出完整腳本。</p><button class="btn alt full" data-gpt="create">產生 GPT 指令</button></div>`}`}
function draftTemplate(){let t=state.topic.trim()||'找到適合自己的生活節奏';if(state.mode==='靈感')return `主題：${t}\n\n角度一｜分享一個真實故事與轉折\n角度二｜整理三個具體可實踐的方法\n角度三｜常見誤區與行動提醒\n\n選一個角度，補上自己的真實經驗。`;if(state.mode==='腳本')return `【${state.format}｜${state.tone}】\n主題：${t}\n\nHOOK｜你是否也曾想過：${t}？\n\n主體｜\n1. 用生活情境引起共鳴。\n2. 分享自己的實際經歷。\n3. 提供一個可以立即行動的建議。\n\nCTA｜你有過類似的經驗嗎？留言聊聊。\n\n提醒：請補充自己的真實案例。`;return `【${state.format}文案】\n\n關於「${t}」，我想分享一個體會。\n\n以前我曾經……\n後來我發現……\n現在我開始嘗試……\n\n你也有類似的經驗嗎？歡迎分享。`}
function weekDays(d){let start=new Date(d+'T12:00:00');start.setDate(start.getDate()-((start.getDay()+6)%7));return Array.from({length:7},(_,i)=>{let a=new Date(start);a.setDate(a.getDate()+i);let k=date(a),r=state.reviews[k];return `<button class="day ${k===state.date?'selected':''}" data-reviewdate="${k}">${'一二三四五六日'[i]}<b style="display:block;margin:5px 0">${a.getDate()}</b><span>${r?`${r.score}分`:'·'}</span></button>`}).join('')}
function chart(){let dates=Array.from({length:7},(_,i)=>{let d=new Date(TODAY+'T12:00:00');d.setDate(d.getDate()-6+i);return date(d)}),values=dates.map(k=>state.reviews[k]?.score||0),segments=[],segment=[];values.forEach((v,i)=>{if(v)segment.push(`${29+i*45},${118-(v-1)*23}`);else if(segment.length){segments.push(segment);segment=[]}});if(segment.length)segments.push(segment);return `<svg class="chart" viewBox="0 0 330 160" role="img" aria-label="最近七天的狀態分數趨勢">${[1,2,3,4,5].map(v=>`<line x1="25" y1="${118-(v-1)*23}" x2="315" y2="${118-(v-1)*23}" stroke="#e8dfd5" stroke-dasharray="3 4"/><text x="8" y="${122-(v-1)*23}" font-size="10" fill="#958272">${v}</text>`).join('')}${segments.map(x=>x.length>1?`<polyline points="${x.join(' ')}" stroke="#987456" fill="none" stroke-width="2.5"/>`:'').join('')}${values.map((v,i)=>v?`<circle cx="${29+i*45}" cy="${118-(v-1)*23}" r="5" fill="#987456"/>`:'').join('')}${dates.map((d,i)=>`<text x="${29+i*45}" y="144" font-size="10" fill="#988675" text-anchor="middle">${Number(d.slice(-2))}</text>`).join('')}</svg>`}
function review(){let r=state.reviews[state.date]||{},seven=Array.from({length:7},(_,i)=>{let d=new Date(TODAY+'T12:00:00');d.setDate(d.getDate()-i);return state.reviews[date(d)]?.score}).filter(Boolean);return title('每日復盤 📓','五分制狀態評分＋三題文字紀錄')+`<div class="card"><div class="row"><b>本週成長足跡</b><span class="small">點選日期即可補寫</span></div><div class="week" style="margin-top:12px">${weekDays(state.date)}</div></div><div class="card"><div class="row"><b>${state.date} 的復盤</b><span class="tag">${r.score?'已紀錄':'未紀錄'}</span></div><label class="fieldlabel">今天的整體狀態如何？</label><div class="scoregrid">${[1,2,3,4,5].map(v=>`<button class="score ${r.score===v?'on':''}" data-score="${v}">${v}</button>`).join('')}</div><div class="soft" style="margin-top:12px;text-align:center"><strong style="font-size:26px">${r.score||'—'} / 5</strong><div class="small">${['請選擇今天的狀態','今天有點辛苦','需要多照顧自己','平穩的一天','今天還不錯','很滿意今天'][r.score||0]}</div></div><p class="small">分數代表今天的感受，不代表你這個人的價值。</p><label class="fieldlabel">01｜今天做得好的一件事？</label><textarea id="win" class="field" rows="2" placeholder="一個小進步也值得紀錄…">${escape(r.win)}</textarea><label class="fieldlabel">02｜今天學到了什麼？</label><textarea id="learn" class="field" rows="2" placeholder="新的發現或需要調整的事…">${escape(r.learn)}</textarea><label class="fieldlabel">03｜明天最重要的一件事？</label><textarea id="next" class="field" rows="2" placeholder="寫下一個可以做到的行動…">${escape(r.next)}</textarea><button class="btn full" data-action="savereview" style="margin-top:15px">儲存每日復盤 ✓</button><button class="btn alt full" data-gpt="review" style="margin-top:9px">✦ 用 ChatGPT 分析復盤 ↗</button></div><h3>近七天狀態趨勢</h3><div class="card"><div class="row"><div><div class="small">七日平均（僅計入已評分日期）</div><strong style="font-size:25px">${scores(seven)} <span class="sub">/ 5</span></strong></div><div class="small">已記錄 ${seven.length} 天</div></div>${chart()}<div class="small">未記錄日期不會算作零分。</div></div><div class="grid"><div class="metric card"><strong>${scores(reviewMonth().map(([,v])=>v.score))}</strong><div class="sub">本月平均分數</div></div><div class="metric card"><strong>${reviewMonth().length}</strong><div class="sub">本月復盤天數</div></div></div><h3>歷史復盤</h3>${reviews().length?reviews().sort(([a],[b])=>b.localeCompare(a)).slice(0,30).map(([k,v])=>`<div class="item"><div class="row"><b>${k}</b><span class="tag">${v.score} / 5</span></div><p class="small">${escape((v.win||v.learn||v.next||'今日已完成復盤').slice(0,110))}</p><button class="mini" data-reviewdate="${k}">查看 / 修改</button></div>`).join(''):'<div class="card empty">第一筆復盤，從今天開始。</div>'}`}
function itemsHTML(items){return items.length?items.map(x=>`<div class="item"><div class="row"><div class="item-title">${escape(x.title)}</div><span class="tag">${escape(x.format||'短影音')}</span></div><div class="small" style="margin:5px 0">${escape(x.date||'尚未排程')} · ${escape(x.status)}</div><p class="small">${escape((x.content||'').slice(0,115))}</p><div class="row"><select class="field" style="max-width:130px;padding:8px" data-status="${escape(x.id)}">${statuses.map(t=>`<option ${x.status===t?'selected':''}>${t}</option>`).join('')}</select><div class="pills"><button class="mini" data-edit="${escape(x.id)}">編輯</button><button class="mini warn" data-delete="${escape(x.id)}">刪除</button></div></div></div>`).join(''):'<div class="card empty">這裡還沒有內容，新增一篇開始吧。</div>'}
function calendar(){let first=new Date(state.year,state.month,1).getDay(),last=new Date(state.year,state.month+1,0).getDate(),count=Math.ceil((first+last)/7)*7;return title('內容行事曆 📅','安排發布日期，掌握未完成的創作')+`<div class="card"><div class="row"><button class="mini" data-month="-1">‹ 上個月</button><b>${state.year} 年 ${state.month+1} 月</b><button class="mini" data-month="1">下個月 ›</button></div><div class="calendar" style="margin-top:17px">${'日一二三四五六'.split('').map(x=>`<span class="small" style="text-align:center">${x}</span>`).join('')}${Array.from({length:count},(_,i)=>{let d=new Date(state.year,state.month,i-first+1),k=date(d),n=state.items.filter(x=>x.date===k).length;return `<button class="day ${k===state.date?'selected':''} ${d.getMonth()!==state.month?'dim':''}" data-caldate="${k}">${d.getDate()}<span class="dot">${n?'●':''}</span></button>`}).join('')}</div><p class="small">小圓點代表該日有安排內容。</p></div><div class="row"><h3>${state.date} 的安排</h3><button class="btn alt" data-edit="new">＋ 新增</button></div>${itemsHTML(state.items.filter(x=>x.date===state.date))}`}
function mine(){let m=state.items.filter(x=>x.date?.slice(0,7)===TODAY.slice(0,7));return title('我的工作室 ☕','內容庫、目標追蹤與資料備份')+`<div class="grid"><div class="card metric"><strong>${state.items.length}</strong><div class="sub">累積內容</div></div><div class="card metric"><strong>${reviews().length}</strong><div class="sub">復盤天數</div></div></div><h3>本月目標</h3><div class="card">${[['已安排內容',m.length,state.goals.publish],['已完成復盤',reviewMonth().length,state.goals.review]].map(([name,n,g])=>`<div style="margin:8px 0 18px"><div class="row" style="font-size:13px;margin-bottom:7px"><b>${name}</b><span>${n} / ${g}</span></div><div class="progress"><div class="fill" style="width:${Math.min(100,n/Math.max(g,1)*100)}%"></div></div></div>`).join('')}<button class="btn alt" data-action="goals">調整目標</button></div><div class="row"><h3>內容資料庫</h3><button class="btn alt" data-edit="new">＋ 新增內容</button></div><div class="pills" style="margin-bottom:13px">${tabs(['全部',...statuses],state.filter,'filter')}</div>${itemsHTML(state.items.filter(x=>state.filter==='全部'||x.status===state.filter))}`}
function getPrompt(kind){if(kind==='create'){let topic=$('#topic')?.value??state.topic,draft=$('#draft')?.value??state.draft;return `你是熟悉臺灣 Instagram、Threads 和短影音的內容策略師。請幫我優化一篇真實自然、具有吸引力的社群內容。\n\n【我的設定】\n主題：${topic||'請協助發想適合自我成長與生活分享的題材'}\n創作模式：${state.mode}\n發布形式：${state.format}\n內容風格：${state.tone}\n\n【草稿】\n${draft||'尚無草稿，請從零開始'}\n\n請用繁體中文提供：\n1. 三個吸引人的 Hook\n2. 一篇完整可直接修改的腳本或文案\n3. 自然不硬銷的 CTA\n4. 影片拍攝或貼文排版建議\n5. 一個最值得優化的地方\n\n不要編造我的人生經歷；需要個人故事之處請保留填寫提示。`;}const r=state.reviews[state.date]||{};return `你是一位擅長每日復盤、自我成長與行動規劃的教練。請溫柔但具體地協助我分析今天的紀錄，不要把分數當作人格價值，也不要替我做心理診斷。\n\n日期：${state.date}\n今日狀態：${r.score||'尚未評分'} / 5 分\n今天做得好的一件事：${$('#win')?.value??r.win??''}\n今天學到了什麼：${$('#learn')?.value??r.learn??''}\n明天最重要的一件事：${$('#next')?.value??r.next??''}\n\n請用精簡的繁體中文整理：\n1. 今天值得肯定的地方\n2. 最重要的收穫與可能需要注意的模式\n3. 明天最值得先做的一個小行動\n4. 給我的一句提醒\n\n明確區分我寫下的事實和你的推測，不過度解讀。`}
function showDialog(html){$('#dialogHost').innerHTML=`<div class="dialogwrap"><div class="dialog">${html}</div></div>`}function closeDialog(){$('#dialogHost').innerHTML=''}function gpt(kind){showDialog(`<div class="row"><div><b>✦ GPT ${kind==='create'?'創作':'復盤'}助手</b><div class="small">先檢查指令，再複製到 ChatGPT</div></div><button class="mini" data-action="close">✕</button></div><label class="fieldlabel">即將提供給 ChatGPT 的指令</label><textarea id="gptprompt" class="field prompt" rows="14">${escape(getPrompt(kind))}</textarea><p class="small">不會自動傳送資料。請自行檢查私人資訊，複製後到 ChatGPT 貼上並送出。</p><button class="btn full" data-action="copyandopen">複製指令並開啟 ChatGPT ↗</button><button class="btn alt full" data-action="copyprompt" style="margin-top:9px">只複製指令</button>`)}
function editItem(id){let x=state.items.find(x=>x.id===id)||{id:'',title:'',content:'',date:state.date,format:'短影音',status:'靈感'};showDialog(`<div class="row"><b>${id?'編輯內容':'新增內容'}</b><button class="mini" data-action="close">✕</button></div><label class="fieldlabel">標題</label><input id="et" class="field" value="${escape(x.title)}"><label class="fieldlabel">內容 / 腳本</label><textarea id="ec" class="field" rows="8">${escape(x.content)}</textarea><label class="fieldlabel">排程日期</label><input id="ed" class="field" type="date" value="${escape(x.date)}"><label class="fieldlabel">發布形式</label><select id="ef" class="field">${['短影音','輪播貼文','Threads','其他'].map(f=>`<option ${f===x.format?'selected':''}>${f}</option>`).join('')}</select><label class="fieldlabel">狀態</label><select id="es" class="field">${statuses.map(f=>`<option ${f===x.status?'selected':''}>${f}</option>`).join('')}</select><button class="btn full" data-saveitem="${escape(x.id)}" style="margin-top:17px">儲存內容</button>`)}
function setting(){showDialog(`<div class="row"><b>工作室設定</b><button class="mini" data-action="close">✕</button></div><p class="small">資料儲存在這個瀏覽器的本機儲存空間，並非雲端同步。請定期下載備份，以免清除網站資料時遺失紀錄。</p><div class="grid"><button class="btn alt" data-action="export">匯出備份 JSON</button><button class="btn alt" data-action="import">匯入備份 JSON</button></div><input type="file" accept=".json,application/json" id="importfile" style="display:none"><p class="small">本版本可嘗試匯入之前 V0.7 / V0.8 的 JSON 備份。匯入會取代目前資料。</p>`)}
function goalDialog(){showDialog(`<div class="row"><b>設定每月目標</b><button class="mini" data-action="close">✕</button></div><label class="fieldlabel">每月安排內容篇數</label><input class="field" id="gp" type="number" min="1" max="999" value="${state.goals.publish}"><label class="fieldlabel">每月復盤天數</label><input class="field" id="gr" type="number" min="1" max="31" value="${state.goals.review}"><button class="btn full" data-action="savegoals" style="margin-top:15px">儲存目標</button>`)}
function render(){renderNav();$('#view').innerHTML=({home,create,calendar,review,mine})[state.page]();persist()}
function snapReview(){const r={...(state.reviews[state.date]||{})};for(const k of ['win','learn','next']){const input=$('#'+k);if(input)r[k]=input.value}return r}
async function copyText(t,element){try{await navigator.clipboard.writeText(t);toast('已複製 ✓');return true}catch{if(element){element.focus();element.select()}toast('瀏覽器未允許自動複製，請手動複製選取文字');return false}}
document.addEventListener('input',e=>{if(e.target.id==='topic')state.topic=e.target.value;if(e.target.id==='draft')state.draft=e.target.value});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.page){state.page=d.page;render();return}if(d.mode){state.mode=d.mode;render();return}if(d.format){state.format=d.format;render();return}if(d.tone){state.tone=d.tone;render();return}if(d.filter){state.filter=d.filter;render();return}if(d.reviewdate){const snapshot=snapReview();if($('#win'))state.reviews[state.date]=snapshot;state.date=d.reviewdate;render();return}if(d.score){const r=snapReview();r.score=Number(d.score);state.reviews[state.date]=r;render();return}if(d.caldate){state.date=d.caldate;render();return}if(d.month){const x=new Date(state.year,state.month+Number(d.month),1);state.year=x.getFullYear();state.month=x.getMonth();state.date=date(x);render();return}if(d.gpt){gpt(d.gpt);return}if(d.edit){editItem(d.edit==='new'?null:d.edit);return}if(d.delete){if(confirm('確定刪除這篇內容？')){state.items=state.items.filter(x=>x.id!==d.delete);render()}return}if(d.saveitem!==undefined){const title=$('#et').value.trim();if(!title){toast('請先輸入標題');return}const id=d.saveitem||randomId(),obj={id,title,content:$('#ec').value,date:$('#ed').value,format:$('#ef').value,status:$('#es').value},index=state.items.findIndex(x=>x.id===id);if(index>=0)state.items[index]=obj;else state.items.unshift(obj);closeDialog();render();toast('已儲存內容 ✓');return}const a=d.action;if(!a)return;if(a==='close'){closeDialog();return}if(a==='generate'){state.topic=$('#topic').value;state.draft=draftTemplate();render();toast('創作框架已產生');return}if(a==='savedraft'){const draft=$('#draft')?.value||'';if(!draft.trim()){toast('請先輸入草稿');return}state.items.unshift({id:randomId(),title:state.topic.trim()||'新的創作',content:draft,date:'',format:state.format,status:'靈感'});state.draft='';state.page='mine';render();toast('已存入內容庫 ✓');return}if(a==='copydraft'){const el=$('#draft');copyText(el.value,el);return}if(a==='savereview'){const r=snapReview();if(!r.score){toast('請先選擇 1～5 分');return}state.reviews[state.date]=r;render();toast('復盤已儲存 ✓');return}if(a==='copyprompt'){const el=$('#gptprompt');copyText(el.value,el);return}if(a==='copyandopen'){const el=$('#gptprompt');const prompt=el.value;const win=window.open('https://chatgpt.com/','_blank','noopener,noreferrer');copyText(prompt,el);if(!win)toast('若沒有開啟分頁，請自行前往 chatgpt.com');return}if(a==='settings'){setting();return}if(a==='goals'){goalDialog();return}if(a==='savegoals'){let p=Number($('#gp').value),r=Number($('#gr').value);if(!Number.isInteger(p)||p<1||p>999||!Number.isInteger(r)||r<1||r>31){toast('請填入有效整數');return}state.goals={publish:p,review:r};closeDialog();render();toast('目標已更新');return}if(a==='export'){const blob=new Blob([JSON.stringify({version:'0.8',exportedAt:new Date().toISOString(),reviews:state.reviews,entries:state.reviews,items:state.items,goals:state.goals},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`LING-Studio-Backup-${TODAY}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('備份檔案已建立');return}if(a==='import'){$('#importfile').click()}});
document.addEventListener('change',async e=>{if(e.target.dataset.status){const item=state.items.find(x=>x.id===e.target.dataset.status);if(item){item.status=e.target.value;render()}return}if(e.target.id==='importfile'){const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text()),records=data.reviews||data.entries;if(!Array.isArray(data.items)||!records||typeof records!=='object'||Array.isArray(records))throw Error('格式錯誤');if(!confirm('匯入資料會取代目前內容與復盤紀錄，確定嗎？'))return;state.items=data.items.filter(x=>x&&typeof x.title==='string').map(x=>({id:String(x.id||randomId()),title:String(x.title),content:String(x.content||''),format:String(x.format||'短影音'),status:statuses.includes(x.status)?x.status:'靈感',date:String(x.date||'')}));state.reviews=Object.fromEntries(Object.entries(records).filter(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&typeof v==='object').map(([k,v])=>[k,{score:Number(v.score)||0,win:String(v.win||''),learn:String(v.learn||''),next:String(v.next||'')} ]));if(data.goals)state.goals={publish:Number(data.goals.publish??data.goals.content)||8,review:Number(data.goals.review)||20};closeDialog();render();toast('匯入成功 ✓')}catch{toast('無法讀取備份，請確認檔案格式')}}});
render();})();
</script></body></html>
